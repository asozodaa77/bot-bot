<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chinese Master · HSK 1–6</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============ THEME ============ */
:root{--bg:#0b0b10;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.10);--text:#f2f0ea;--muted:#9a98a3;
  --red:#e23b3b;--red2:#a8171f;--gold:#e8b94a;--ok:#6fdc98;--bad:#ff7d7d;--r:20px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC",sans-serif}
body{background:radial-gradient(520px 360px at 85% -5%,rgba(226,59,59,.26),transparent 70%),
  radial-gradient(420px 320px at -10% 35%,rgba(232,185,74,.11),transparent 70%),var(--bg);background-attachment:fixed}
button,input{font:inherit;color:inherit;border:0;background:none}button{cursor:pointer}
#main{max-width:480px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 96px)}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hide{display:none!important}.muted{color:var(--muted)}.gold{color:var(--gold)}
h1{font-size:22px;font-weight:800;margin-bottom:12px}h1 b{background:linear-gradient(90deg,var(--gold),#fff3c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:16px 4px 10px}

/* bottom tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 12px calc(var(--sb) + 10px)}
nav div{display:flex;width:100%;max-width:456px;padding:6px;gap:4px;background:rgba(18,18,26,.82)}
nav button{flex:1;padding:8px 0;border-radius:16px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
nav button span{font-size:20px}nav button.on{background:rgba(226,59,59,.16);color:var(--text)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line)}
.chip.on{background:linear-gradient(145deg,var(--red),var(--red2));color:#fff;border-color:transparent}

/* book banner */
.book{display:flex;gap:14px;align-items:center;padding:14px;margin:14px 0 4px}
.book img,.cover{flex:none;width:72px;height:96px;border-radius:8px 12px 12px 8px;object-fit:cover;box-shadow:6px 8px 18px rgba(0,0,0,.5)}
.cover{display:grid;place-items:center;text-align:center;font-weight:800;background:linear-gradient(150deg,var(--red),var(--red2));border-left:5px solid var(--gold);font-size:12px;line-height:1.3}
.cover b{display:block;font-size:26px;color:var(--gold)}
.book h3{font-size:16px}.book p{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}

/* lesson rows */
.lesson{display:flex;align-items:center;gap:14px;width:100%;padding:13px;margin-bottom:10px;text-align:left;transition:transform .15s}
.lesson:active{transform:scale(.97)}
.num{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:700;background:linear-gradient(145deg,var(--red),var(--red2))}
.lesson.lock .num{background:rgba(255,255,255,.07);color:var(--muted)}.lesson.ok .num{background:linear-gradient(145deg,var(--gold),#b8861c);color:#2a1d00}
.info{flex:1;min-width:0}.info h3{font-size:15.5px;font-weight:650}.info p{font-size:12.5px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;padding:4px 9px;border-radius:99px;font-weight:600;flex:none}
.tag.f{background:rgba(232,185,74,.14);color:var(--gold)}.tag.p{background:rgba(226,59,59,.14);color:var(--bad)}.tag.d{background:rgba(80,200,120,.14);color:var(--ok)}

/* words */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top h2{font-size:18px;flex:1}
.back{width:42px;height:42px;border-radius:14px;font-size:20px;display:grid;place-items:center}
.word{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.hz{font-size:34px;font-weight:600;min-width:80px;line-height:1.1}.wt{flex:1;min-width:0}
.py{color:var(--gold);font-weight:600;font-size:15px}.tr{font-size:15px;margin-top:2px}.tr.s{font-size:12.5px;color:var(--muted)}
.play{flex:none;width:44px;height:44px;border-radius:50%;font-size:16px;display:grid;place-items:center;background:rgba(232,185,74,.14);color:var(--gold);border:1px solid rgba(232,185,74,.35)}
.play:active{background:var(--gold);color:#2a1d00;transform:scale(.9)}
.sent{padding:16px;margin:0 0 14px}.sent .hz{font-size:22px;min-width:0}
.cta{width:100%;padding:15px;border-radius:18px;font-weight:700;font-size:16px;margin-top:8px;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 10px 24px rgba(226,59,59,.3)}
.cta:active{transform:scale(.97)}.cta.alt{background:var(--card);border:1px solid var(--line);box-shadow:none}
.cta.done{background:rgba(80,200,120,.16);color:var(--ok);box-shadow:none;border:1px solid rgba(80,200,120,.35)}
.search{width:100%;padding:13px 16px;border-radius:16px;margin:12px 0 10px;background:var(--card);border:1px solid var(--line);outline:0}

/* practice */
.menu{display:grid;gap:12px}.mc{display:flex;gap:14px;align-items:center;padding:18px;text-align:left;width:100%}
.mc span{font-size:30px}.mc h3{font-size:16px}.mc p{font-size:12.5px;color:var(--muted)}
.flash{height:260px;perspective:900px;margin:14px 0}
.fc{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.face.b{transform:rotateY(180deg)}.big{font-size:64px;font-weight:600}
.row2{display:flex;gap:10px}.row2 .cta{margin-top:0}
.opt{display:block;width:100%;padding:15px;margin-bottom:10px;border-radius:16px;font-size:15.5px;text-align:left;background:var(--card);border:1px solid var(--line)}
.opt.good{background:rgba(80,200,120,.18);border-color:var(--ok)}.opt.wrong{background:rgba(255,125,125,.16);border-color:var(--bad)}
.qh{text-align:center;padding:26px 10px;margin-bottom:14px}.qh .big{font-size:56px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt button{padding:16px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px;min-height:60px}
.mt .hzb{font-size:26px}.mt .sel{border-color:var(--gold);background:rgba(232,185,74,.14)}.mt .got{opacity:.3;pointer-events:none;border-color:var(--ok)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.res{text-align:center;padding:30px 16px}.res .big{font-size:54px}

/* profile */
.me{display:flex;align-items:center;gap:14px;padding:16px}.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:linear-gradient(145deg,var(--red),var(--red2))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stats div{padding:14px 6px;text-align:center}.stats b{display:block;font-size:22px;color:var(--gold)}.stats small{font-size:11px;color:var(--muted)}
.lv{padding:12px 14px;margin-bottom:8px;font-size:13px}.lv div:first-child{display:flex;justify-content:space-between;margin-bottom:6px}
.prem{padding:20px;text-align:center;border-color:rgba(232,185,74,.4);background:linear-gradient(160deg,rgba(232,185,74,.12),rgba(226,59,59,.10))}
.prem h3{font-size:19px;margin:4px 0}.prem p{font-size:13px;color:var(--muted);margin-bottom:10px}

/* modal + toast */
.ov{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:480px;padding:26px 22px calc(var(--sb) + 20px);text-align:center;background:#16161d;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;animation:sheet .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(100%)}}.modal h3{font-size:22px;margin:6px 0}.modal p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translateX(-50%);padding:11px 18px;border-radius:14px;background:#22222c;border:1px solid var(--line);font-size:13px;z-index:10;animation:up .3s}
</style>
</head>
<body>
<div id="main"></div>
<nav><div class="glass" id="nav"></div></nav>
<div class="ov hide" id="ov"><div class="modal">

</div></div>

<script>
/* ================= CONFIG ================= */
const FREE_LIMIT = 10;         // 10 free lessons for HSK 1, lessons 11-15 = Premium
const AUDIO_BASE = ""; 
const BOOKS = {
  1:{img:"img/hsk1.jpg", t:"Китоби дарсӣ · HSK 1 (2.0)"},
  2:{img:"img/hsk2.jpg", t:"Китоби дарсӣ · HSK 2"},
  3:{img:"img/hsk3.jpg", t:"Китоби дарсӣ · HSK 3"}
};

/* ================= TELEGRAM ================= */
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0b0b10"); tg.setBackgroundColor("#0b0b10"); } catch(e){} }
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const haptic = t => { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch(e){} };
let backFn = null;
const setBack = f => { backFn = f; try { f ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} };
try { tg.BackButton.onClick(() => backFn && backFn()); } catch(e){}

/* ================= STORAGE ================= */
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
            try { tg.CloudStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ================= CONTENT (HSK 1 Version 2.0 - 15 Lessons) ================= */
const P = s => s.split(";").map(x => x.split("|"));
const LV = {
 1:[
    /* Lesson 1 */
    ["Салом ва дуруд",["你好，很高兴认识你。","nǐ hǎo, hěn gāoxìng rènshi nǐ.","Салом, аз шиносоӣ шодам."],
     P("你好|nǐ hǎo|Салом|Привет|Hello;您好|nín hǎo|Салом (бо эҳтиром)|Здравствуйте|Hello (polite);谢谢|xièxie|Ташаккур|Спасибо|Thank you;不客气|bú kèqi|Намеояд|Не за что|You’re welcome;对不起|duìbuqǐ|Бубахшед|Извините|Sorry;再见|zàijiàn|Хайр|До свидания|Goodbye")],
    /* Lesson 2 */
    ["Рақамҳо ва санаҳо",["今天是十月二十四号。","jīntiān shì shí yuè èrshísì hào.","Имрӯз 24-уми октябр аст."],
     P("一|yī|Як|Один|One;二|èr|Ду|Два|Two;三|sān|Се|Три|Three;十|shí|Даҳ|Десять|Ten;今天|jīntiān|Имрӯз|Сегодня|Today;明天|míngtiān|Фардо|Завтра|Tomorrow")],
    /* Lesson 3 */
    ["Оила ва дӯстон",["我爸爸妈妈很爱我。","wǒ bàba māma hěn ài wǒ.","Падару модарам маро бисёр дӯст медоранд."],
     P("爸爸|bàba|Падар|Папа|Father;妈妈|māma|Модар|Мама|Mother;哥哥|gēge|Бародари калон|Старший брат|Older brother;姐姐|jiějie|Хоҳари калон|Старшая сестра|Older sister;朋友|péngyou|Дӯст|Друг|Friend;家|jiā|Хона / оила|Дом / семья|Home / family")],
    /* Lesson 4 */
    ["Хӯрок ва нӯшокӣ",["我想喝茶。","wǒ xiǎng hē chá.","Ман мехоҳам чой нӯшам."],
     P("水|shuǐ|Об|Вода|Water;茶|chá|Чой|Чай|Tea;米饭|mǐfàn|Биринҷ|Рис|Rice;苹果|píngguǒ|Себ|Яблоко|Apple;吃|chī|Хӯрдан|Есть|To eat;喝|hē|Нӯшидан|Пить|To drink")],
    /* Lesson 5 */
    ["Харид ва нарх",["这个多少钱？","zhège duōshao qián?","Ин чанд пул аст?"],
     P("多少钱|duōshao qián|Чанд пул?|Сколько стоит?|How much?;买|mǎi|Харидан|Купить|To buy;贵|guì|Гарон|Дорого|Expensive;便宜|piányi|Арзон|Дёшево|Cheap;块|kuài|Юан|Юань|Yuan;商店|shāngdiàn|Мағоза|Магазин|Shop")],
    /* Lesson 6 */
    ["Вақт ва соат",["现在几点？","xiànzài jǐ diǎn?","Ҳоло соат чанд аст?"],
     P("现在|xiànzài|Ҳоло|Сейчас|Now;点|diǎn|Соат|Час|O'clock;分|fēn|Дақиқа|Минута|Minute;中午|zhōngwӯ|Нимаи рӯз|Полдень|Noon;时候|shihou|Вақт|Время|Time")],
    /* Lesson 7 */
    ["Хона ва ҷой",["我的书在桌子上。","wǒ de shū zài zhuōzi shàng.","Китоби ман дар болои миз аст."],
     P("书|shū|Китоб|Книга|Book;桌子|zhuōzi|Миз|Стол|Table;上面|shàngmian|Дар боло|Наверху|On top;里|lǐ|Дар дарун|Внутри|Inside;哪儿|nάρ|Куҷо|Где|Where;字|zì|Ҳарф|Иероглиф|Character")],
    /* Lesson 8 */
    ["Кор ва машғулият",["他在 Dushanbe 工作。","tā zài Dushanbe gōngzuò.","Ӯ дар Душанбе кор мекунад."],
     P("工作|gōngzuò|Кор кардан / кор|Работать / работа|To work / work;医生|yīshēng|Духтур|Врач|Doctor;医院|yīyuàn|Беморхона|Больница|Hospital;做|zuò|Кардан|Делать|To do;学生|xuésheng|Донишҷӯ|Ученик|Student")],
    /* Lesson 9 */
    ["Ҳаво ва табиат",["今天天气руз.","jīntiān tiānqì hěn hǎo.","Обу ҳавои имрӯз хуб аст."],

    /* Lesson 10 */
    ["Хӯрдан ва пухтупаз",["你会做中国菜吗？","nǐ huì zuò zhōngguó cài ma?","Оё ту хӯроки чинӣ пухта метавонӣ?"],
     P("会|huì|Тавонистан|Уметь|Can;菜|cài|Хӯрок / сабзавот|Блюдо / овощ|Dish / vegetable;做|zuò|Пухтан / кардан|Готовить / делать|To cook / make;好吃|hǎochī|Маззадор|Вкусно|Delicious; 怎么|zěnme|Чӣ тавр|Как|How")],
    /* Lesson 11 (Premium) */
    ["Сафар ва нақлиёт",["我想去北京旅游。","wǒ xiǎng qù běijīng lǚyóu.","Ман мехоҳам ба Пекин сафар кунам."],
     P("去|qù|Рафтан|Идти|To go; 飞机|fēijī|Ҳавопаймо|Самолёт|Plane; 哪儿|nǎr|Куҷо|Куда|Where; 坐|zuò|Нишастан|Сидеть|To sit / take; 火车站|huǒchēzhàn|Истгоҳи оҳан|Ж/д вокзал|Train station")],
    /* Lesson 12 (Premium) */
    ["Ҷойгиршавӣ",["银行在学校前面。","yínháng zài xuéxiào qiánmiàn.","Бонк пеши мактаб аст."],
     P("前面|qiánmiàn|Пеш / дар пеш|Впереди|In front; 后面|hòumiàn|Қафо / дар қафо|Сзади|Behind; 银行|yínháng|Бонк|Банк|Bank; 远|yuǎn|Дур|Далеко|Far; 近|jìn|Наздик|Близко|Near")],
    /* Lesson 13 (Premium) */
    ["Вазъи саломатӣ",["我身体有点儿不舒服。","wǒ shēntǐ yǒudiǎnr bù shūfu.","Тани ман каме нороҳат аст."],
     P("身体|shēntǐ|Бадан / саломатӣ|Тело / здоровье|Body / health; 药|yào|Дору|Лекарство|Medicine; 医院|yīyuàn|Беморхона|Больница|Hospital; 休息|xiūxi|Истироҳат кардан|Отдыхать|To rest; 觉|jiào|Хоб|Сон|Sleep")],
    /* Lesson 14 (Premium) */
    ["Ориентирҳо ва рангҳо",["那个红色的很好看。","nà ge hóngsè de hěn hǎokàn.","Он чизи сурх хеле зебо аст."],
     P("颜色|yánsè|Ранг|Цвет|Color; 红色|hóngsè|Сурх|Красный|Red; 绿色|lǜsè|Сабз|Зелёный|Green; 穿|chuān|Пӯшидан (либос)|Одевать|To wear; 衣服|yīfu|Либос|Одежда|Clothes")],
    /* Lesson 15 (Premium) */
    ["Хариду фурӯш ва таассурот",["这件衣服太贵了。","zhè jiàn yīfu tài guì le.","Ин либос хеле гарон аст."],
     P("贵|guì|Гарон|Дорого|Expensive; 便宜|piányi|Арзон|Дешево|Cheap; 试|shì|Санҷидан|Примерять|To try; 颜色|yánsè|Ранг|Цвет|Color; 觉得|juéde|Фикр кардан|Думать|To think")]
  ],
  /* HSK 2-6 locked / temporary placeholders */
  2:[["Ба зудӣ кушода мешавад",["敬请期待","jìngqǐng qīdài","Мунтазир бошед"],P("学习|xuéxí|Омӯзиш|Учиться|Study")]],
  3:[["Ба зудӣ кушода мешавад",["敬请期待","jìngqǐng qīdài","Мунтазир бошед"],P("学习|xuéxí|Омӯзиш|Учиться|Study")]],
  4:[["Ба зудӣ кушода мешавад",["敬请期待","jìngqǐng qīdài","Мунтазир бошед"],P("学习|xuéxí|Омӯзиш|Учиться|Study")]],
  5:[["Ба зудӣ кушода мешавад",["敬请期待","jìngqǐng qīdài","Мунтазир бошед"],P("学习|xuéxí|Омӯзиш|Учиться|Study")]],
  6:[["Ба зудӣ кушода мешавад",["敬请期待","jìngqǐng qīdài","Мунтазир бошед"],P("学习|xuéxí|Омӯзиш|Учиться|Study")]]
};

const ALL = Object.values(LV).flatMap(l => l.flatMap(x => x[2] || []));

/* ================= STATE ================= */
let tab = "lessons", lvl = store.get("lvl") || 1, lang = store.get("lang") || "tg";
let done = store.get("done") || [], premium = !!store.get("premium"), slow = false, cur = 0, vq = "";
let st = store.get("streak") || {d:"", n:0};
const today = new Date().toDateString();
if (st.d !== today) { st = {d: today, n: st.d === new Date(Date.now() - 864e5).toDateString() ? st.n + 1 : 1}; store.set("streak", st); }

const $ = s => document.querySelector(s);
const LI = {tg:2, ru:3, en:4};
const tr = w => w[LI[lang]];
const shuf = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

/* Lock rule: HSK 1 lessons 11+ are locked unless premium. All HSK 2-6 are locked unless premium. */
const locked = i => (lvl === 1 && i >= FREE_LIMIT && !premium) || (lvl > 1 && !premium);
const wordsOf = l => LV[l].flatMap((x, i) => (l === 1 && locked(i)) ? [] : (x[2] || []));
const pool = () => { const p = wordsOf(lvl); return p.length >= 5 ? p : ALL; };
const totalLessons = l => LV[l].length;
const lvDone = l => done.filter(k => k.startsWith(l + "-")).length;
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ================= AUDIO ================= */
function tts(t){
  if (!window.speechSynthesis) return toast("Овоз дастгирӣ намешавад");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = slow ? .5 : .85; speechSynthesis.speak(u);
}
function say(t){
  haptic();
  if (!AUDIO_BASE) return tts(t);
  const a = new Audio(AUDIO_BASE + encodeURIComponent(t) + ".mp3"); a.playbackRate = slow ? .6 : 1;
  a.onerror = () => tts(t); a.play().catch(() => tts(t));
}
const pb = t => `<button class="play" data-a="say" data-t="${t}" aria-label="Play">▶</button>`;

/* ================= RENDER HELPERS ================= */
function show(h, back){ $("#main").innerHTML = h; window.scrollTo(0, 0); setBack(back || null); }
const head = (t, extra = "") => `<div class="top"><button class="back glass" data-a="back">←</button><h2>${t}</h2>${extra}</div>`;
const slowBtn = () => `<button class="chip ${slow ? "on" : ""}" data-a="slow">🐢 Суст</button>`;
const chipsLv = () => `<div class="chips">${[1,2,3,4,5,6].map(l => `<button class="chip ${l === lvl ? "on" : ""}" data-a="lvl" data-v="${l}">HSK ${l}</button>`).join("")}</div>`;
const langBar = () => `<div class="chips" style="margin-bottom:12px">${[["tg","Тоҷикӣ"],["ru","Русский"],["en","English"]].map(l => `<button class="chip ${lang === l[0] ? "on" : ""}" data-a="lang" data-v="${l[0]}">${l[1]}</button>`).join("")}</div>`;
const coverHTML = l => `<div class="cover"><div>HSK<b>${l}</b>汉语</div></div>`;
const wordRow = (w, k = 0) => `<div class="word glass" style="animation-delay:${k * 50}ms"><div class="hz">${w[0]}</div>
  <div class="wt"><div class="py">${w[1]}</div><div class="tr">${tr(w)}</div></div>${pb(w[0])}</div>`;

function renderNav(){
  const T = [["lessons","📚","Дарсҳо"],["vocab","🔤","Луғат"],["practice","🎯","Машқ"],["profile","👤","Профил"]];
  $("#nav").innerHTML = T.map(t => `<button class="${tab === t[0] ? "on" : ""}" data-a="tab" data-v="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");
}
function render(){ renderNav(); ({lessons:rLessons, vocab:rVocab, practice:rPractice, profile:rProfile})[tab](); }

/* ================= TAB: LESSONS ================= */
function rLessons(){
  const b = BOOKS[lvl], n = lvDone(lvl), tot = totalLessons(lvl);
  const img = b ? `<img src="${b.img}" alt="HSK ${lvl}" onerror="this.outerHTML=coverHTML(${lvl})">` : coverHTML(lvl);
  show(`<h1>Chinese Master / <b>HSK ${lvl}</b></h1>${chipsLv()}
    <div class="book glass">${img}<div style="flex:1"><h3>${b ? b.t : "HSK " + lvl + " · барномаи таълим"}</h3>
      <p>${n} аз ${tot} дарс анҷом ёфт</p><div class="pbar"><i style="width:${n / tot * 100}%"></i></div></div></div>
    <div class="sec">Дарсҳо</div>` +
    LV[lvl].map((x, i) => {
      const lk = locked(i), d = done.includes(lvl + "-" + i);
      return `<button class="lesson glass ${lk ? "lock" : d ? "ok" : ""}" data-a="lesson" data-v="${i}">
        <div class="num">${lk ? "🔒" : d ? "✓" : i + 1}</div>
        <div class="info"><h3>${i + 1}. ${x[0]}</h3><p>${x[2] ? x[2].length + " калима" : "Ба зудӣ"}</p></div>
        <span class="tag ${lk ? "p" : d ? "d" : "f"}">${lk ? "Premium" : d ? "Анҷом" : "Ройгон"}</span></button>`;
    }).join(""));
}
function openLesson(i){
  const x = LV[lvl][i]; cur = i;
  if (locked(i)) return modal(x[0]);
  if (!x[2]) return toast("Ин дарс ба зудӣ илова мешавад 🚧");
  const d = done.includes(lvl + "-" + i);
  show(head(`${i + 1}. ${x[0]}`, slowBtn()) + langBar() + x[2].map(wordRow).join("") +
    `<div class="sec">Ҷумлаи намунавӣ</div><div class="sent glass"><div style="display:flex;gap:12px;align-items:center">
      <div style="flex:1"><div class="hz">${x[1][0]}</div><div class="py" style="margin-top:6px">${x[1][1]}</div><div class="tr s">${x[1][2]}</div></div>${pb(x[1][0])}</div></div>
    <button class="cta ${d ? "done" : ""}" data-a="done">${d ? "✓ Анҷом ёфт" : "✅ Анҷом шуд — қайд кунед"}</button>
    <button class="cta alt" data-a="quizLesson">🎯 Машқи ин дарс</button>`, rLessons);
}

/* ================= TAB: VOCABULARY ================= */
function rVocab(){
  show(`<h1>Луғат · <b>HSK ${lvl}</b></h1>${chipsLv()}
    <input class="search" id="q" placeholder="🔎 你好, nǐ hǎo, салом…" value="${vq}">${langBar()}<div id="vl"></div>`);
  $("#q").addEventListener("input", e => { vq = e.target.value; vList(); }); vList();
}
function vList(){
  const q = vq.trim().toLowerCase(), L = wordsOf(lvl).filter(w => !q || w.join(" ").toLowerCase().includes(q));
  $("#vl").innerHTML = L.length ? L.map(wordRow).join("") : `<p class="muted" style="text-align:center;padding:30px">Калима ёфт нашуд</p>`;
}

/* ================= TAB: PRACTICE ================= */
function rPractice(){
  show(`<h1>Машқи <b>рӯзона</b></h1><p class="muted" style="font-size:13px;margin-bottom:14px">Калимаҳои HSK ${lvl} (дарсҳои кушода)</p>${chipsLv()}
    <div class="menu" style="margin-top:14px">
    <button class="mc glass" data-a="flash"><span>🃏</span><div><h3>Флешкортҳо</h3><p>Гардонед ва такрор кунед</p></div></button>
    <button class="mc glass" data-a="quiz"><span>❓</span><div><h3>Викторина</h3><p>5 савол · интихоби тарҷума</p></div></button>
    <button class="mc glass" data-a="match"><span>🧩</span><div><h3>Ҷуфтҷӯӣ</h3><p>Ҳанзиро бо тарҷумааш пайваст кунед</p></div></button></div>`);
}
let deck = [], fi = 0, fk = 0;
function flash(){ deck = shuf(pool()).slice(0, 10); fi = 0; fk = 0; fStep(); }
function fStep(){
  if (fi >= deck.length) return result("🃏", `${fk} / ${deck.length}`, "Калимаҳое, ки медонед", flash);
  const w = deck[fi];
  show(head(`Флешкорт ${fi + 1}/${deck.length}`, slowBtn()) + `<div class="flash" data-a="flip"><div class="fc" id="fc">
    <div class="face glass"><div class="big">${w[0]}</div><div class="muted" style="font-size:13px">Барои гардонидан зер кунед</div>${pb(w[0])}</div>
    <div class="face b glass"><div class="py" style="font-size:22px">${w[1]}</div><div class="big" style="font-size:34px">${tr(w)}</div>${pb(w[0])}</div></div></div>
    <div class="row2"><button class="cta alt" data-a="fno">🔁 Такрор</button><button class="cta" data-a="fyes">✓ Медонам</button></div>`, rPractice);
}
let qs = [], qi = 0, sc = 0, lockQ = false;
const mkQ = w => ({w, o: shuf([w, ...shuf(ALL.filter(x => x[0] !== w[0])).slice(0, 3)])});
function quizFrom(words){ qs = shuf(words).slice(0, 5).map(mkQ); qi = 0; sc = 0; qStep(); }
function qStep(){
  if (qi >= qs.length) return result(sc >= 4 ? "🏆" : "👏", `${sc} / ${qs.length}`, "Натиҷаи викторина", () => quizFrom(pool()));
  const q = qs[qi]; lockQ = false;
  show(head(`Савол ${qi + 1}/${qs.length}`, slowBtn()) + `<div class="qh glass"><div class="big">${q.w[0]}</div><div class="py">${q.w[1]}</div><div style="margin-top:10px">${pb(q.w[0])}</div></div>` +
    q.o.map((o, k) => `<button class="opt" data-a="qa" data-v="${k}">${tr(o)}</button>`).join(""), rPractice);
}
let mp = [], ml = [], mr = [], msel = null, mgot = 0, mtry = 0;
function match(){ mp = shuf(pool()).slice(0, 5).map(w => w.slice()); ml = shuf([0,1,2,3,4]); mr = shuf([0,1,2,3,4]); msel = null; mgot = 0; mtry = 0; mRender(); }
function mRender(){
  if (mgot >= 5) return result("🧩", `${mtry} кӯшиш`, "Ҳама ҷуфт шуданд!", match);
  show(head("Ҷуфтҷӯӣ") + `<div class="mt">` +
    ml.map(i => `<button class="hzb ${mp[i].g ? "got" : ""} ${msel === i ? "sel" : ""}" data-a="mt" data-s="l" data-v="${i}">${mp[i][0]}</button>`).join("") +
    `</div><div class="sec">Тарҷума</div><div class="mt">` +
    mr.map(i => `<button class="${mp[i].g ? "got" : ""}" data-a="mt" data-s="r" data-v="${i}">${tr(mp[i])}</button>`).join("") + `</div>`, rPractice);
}
let again = null;
function result(ic, big, txt, fn){
  again = fn;
  show(head("Натиҷа") + `<div class="res glass"><div style="font-size:56px">${ic}</div><div class="big gold">${big}</div><p class="muted" style="margin:6px 0 16px">${txt}</p>
    <button class="cta" data-a="again">Аз нав</button><button class="cta alt" data-a="back">Бозгашт</button></div>`, rPractice);
}

/* ================= TAB: PROFILE / PAYWALL ================= */
function rProfile(){
  const name = user ? user.first_name : "Донишҷӯ";
  show(`<h1>Профил</h1><div class="me glass"><div class="av">${name[0]}</div><div><h3>${name}</h3><p class="muted" style="font-size:13px">${premium ? "👑 Premium" : "Ҳисоби ройгон"}</p></div></div>
    <div class="stats"><div class="glass"><b>${done.length}</b><small>Дарсҳо</small></div><div class="glass"><b>${st.n}🔥</b><small>Рӯзҳои пай дар пай</small></div><div class="glass"><b>${ALL.length}</b><small>Калимаҳо</small></div></div>
    ${premium ? "" : `<div class="prem glass"><div style="font-size:34px">👑</div><h3>Premium</h3><p>Дарсҳои 11-15 дар HSK 1 ва сатҳҳои HSK 2–6 пурра кушода мешаванд.</p><button class="cta" data-a="unlock">🔓 Харидани Premium</button></div>`}
    <div class="sec">Пешрафт</div>` +
    [1,2,3,4,5,6].map(l => `<div class="lv glass"><div><span>HSK ${l}</span><span class="muted">${lvDone(l)}/${totalLessons(l)}</span></div><div class="pbar"><i style="width:${lvDone(l) / totalLessons(l) * 100}%"></i></div></div>`).join("") +
    `<div class="sec">Забони тарҷума</div>${langBar()}
    <button class="chip" style="margin-top:14px" data-a="demo">🧪 Демо: Premium ${premium ? "хомӯш" : "фаъол"} кунед</button>`);
}
function modal(t){
  $("#mTxt").textContent = t ? `Дарси «${t}» танҳо барои Premium дастрас аст. Дарсҳои 1–${FREE_LIMIT} ройгонанд.` : "Бо Premium ҳамаи дарсҳои HSK 1–6 кушода мешаванд.";
  $("#ov").classList.remove("hide"); try { tg.HapticFeedback.notificationOccurred("warning"); } catch(e){}
}
const closeModal = () => $("#ov").classList.add("hide");

/* ================= EVENTS ================= */
const A = {
  tab: v => { tab = v; render(); },
  lvl: v => { lvl = +v; store.set("lvl", lvl); render(); },
  lang: v => { lang = v; store.set("lang", v); tab === "profile" ? rProfile() : tab === "vocab" ? rVocab() : openLesson(cur); },
  lesson: v => openLesson(+v),
  say: (v, el) => say(el.dataset.t),
  slow: () => { slow = !slow; toast(slow ? "🐢 Суст" : "Суръати муқаррарӣ"); document.querySelectorAll('[data-a="slow"]').forEach(b => b.classList.toggle("on", slow)); },
  done: () => { const k = lvl + "-" + cur; done = done.includes(k) ? done.filter(x => x !== k) : done.concat(k); store.set("done", done);
    try { tg.HapticFeedback.notificationOccurred("success"); } catch(e){} openLesson(cur); },
  quizLesson: () => quizFrom(LV[lvl][cur][2]),
  flash, match, quiz: () => quizFrom(pool()), again: () => again && again(),
  flip: () => $("#fc").classList.toggle("flip"),
  fyes: () => { fk++; fi++; fStep(); }, fno: () => { fi++; fStep(); },
  qa: v => { if (lockQ) return; lockQ = true; const q = qs[qi]; if (q.o[v][0] === q.w[0]) sc++;
    document.querySelectorAll(".opt").forEach((b, k) => { if (q.o[k][0] === q.w[0]) b.classList.add("good"); else if (k == v) b.classList.add("wrong"); });
    setTimeout(() => { qi++; qStep(); }, 900); },
  mt: (v, el) => { const i = +v;
    if (el.dataset.s === "l") { msel = i; return mRender(); }
    if (msel === null) return toast("Аввал ҳанзиро интихоб кунед");
    mtry++;
    if (i === msel) { mp[i].g = true; mgot++; msel = null; haptic("medium"); mRender(); }
    else { el.classList.add("shake"); haptic("heavy"); } },
  unlock: () => { closeModal(); toast("💳 Пардохт ба зудӣ илова мешавад"); },
  demo: () => { premium = !premium; store.set("premium", premium); rProfile(); },
  close: closeModal,
  back: () => backFn ? backFn() : render()
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const f = A[el.dataset.a]; if (f) f(el.dataset.v, el, e);
});
$("#ov").addEventListener("click", e => { if (e.target.id === "ov") closeModal(); });
render();
</script>
</body>
</html>
